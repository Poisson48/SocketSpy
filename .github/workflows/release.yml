name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ninja-build git pkg-config liburing-dev \
            lua5.4 liblua5.4-dev libgl1-mesa-dev libfuse2 \
            python3-pip patchelf libssl-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libxcb-cursor0 libxcb-cursor-dev \
            libxcb-xkb1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-util1 libxcb-ewmh2 \
            libdrm2 libgbm1 libegl1
          pip3 install --upgrade cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install aqtinstall and Qt 6.6 static
        run: bash scripts/dev/install_qt_static.sh

      - name: Bootstrap vcpkg
        run: |
          VCPKG_ROOT="${HOME}/.local/share/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          bash "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          # Dependencies are installed automatically by the CMake toolchain
          # via vcpkg.json manifest mode during cmake configure.

      - name: CMake configure (release preset)
        run: |
          QT_PREFIX="${HOME}/Qt/6.6.3/gcc_64"
          cmake --preset release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX}" \
            -DCMAKE_TOOLCHAIN_FILE="${HOME}/.local/share/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: CMake build (release preset)
        run: cmake --build --preset release --parallel $(nproc)

      - name: Download linuxdeploy and Qt plugin
        run: |
          curl -fsSL -o /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o /tmp/linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt

      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DESTDIR=/tmp/appdir cmake --install build/release
          QT_PREFIX="${HOME}/Qt/6.6.3/gcc_64"
          QMAKE="${QT_PREFIX}/bin/qmake" \
          LD_LIBRARY_PATH="${QT_PREFIX}/lib:${LD_LIBRARY_PATH:-}" \
          EXTRA_QT_PLUGINS="charts;serialbus;serialport" \
          /tmp/linuxdeploy \
            --appdir /tmp/appdir \
            --plugin qt \
            --output appimage \
            --executable /tmp/appdir/usr/bin/socketspy
          mv SocketSpy-*.AppImage "SocketSpy-${VERSION}-x86_64.AppImage"

      - name: Sign release manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE="SocketSpy-${VERSION}-x86_64.AppImage"
          SHA256=$(sha256sum "$APPIMAGE" | awk '{print $1}')
          printf '{\n  "version": "%s",\n  "filename": "%s",\n  "sha256": "%s"\n}\n' \
              "$VERSION" "$APPIMAGE" "$SHA256" > release-manifest.json
          echo "$UPDATE_SIGNING_KEY" > /tmp/_sign_key.pem
          chmod 600 /tmp/_sign_key.pem
          openssl pkeyutl -sign -inkey /tmp/_sign_key.pem -rawin \
              -in release-manifest.json -out release-manifest.json.sig
          rm -f /tmp/_sign_key.pem
          echo "Manifest signed for v${VERSION} (sha256=${SHA256})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SocketSpy-*-x86_64.AppImage
            release-manifest.json
            release-manifest.json.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
