<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0f1623"/>
  <!-- CAN bus line -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="16" cy="32" r="5" fill="#6366f1"/>
  <circle cx="32" cy="32" r="5" fill="#6366f1"/>
  <circle cx="48" cy="32" r="5" fill="#6366f1"/>
  <!-- Signal waves above middle node -->
  <path d="M26 20 Q28 15 30 20 Q32 25 34 20 Q36 15 38 20"
        stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Terminators -->
  <rect x="4" y="28" width="4" height="8" rx="1" fill="#3d5270"/>
  <rect x="56" y="28" width="4" height="8" rx="1" fill="#3d5270"/>
  <!-- Drop lines from nodes -->
  <line x1="16" y1="32" x2="16" y2="44" stroke="#3d5270" stroke-width="2"/>
  <line x1="32" y1="32" x2="32" y2="44" stroke="#3d5270" stroke-width="2"/>
  <line x1="48" y1="32" x2="48" y2="44" stroke="#3d5270" stroke-width="2"/>
  <rect x="11" y="44" width="10" height="8" rx="2" fill="#1a2235" stroke="#3d5270" stroke-width="1"/>
  <rect x="27" y="44" width="10" height="8" rx="2" fill="#1a2235" stroke="#6366f1" stroke-width="1"/>
  <rect x="43" y="44" width="10" height="8" rx="2" fill="#1a2235" stroke="#3d5270" stroke-width="1"/>
</svg>
